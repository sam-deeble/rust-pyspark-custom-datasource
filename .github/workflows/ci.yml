name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Lets cargo build the PyO3 crate against the project's Python. Must be
      # absolute: build scripts run from the crate's directory.
      PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v10.2.0

      # rustup is preinstalled on GitHub runners; rust-toolchain.toml selects the
      # toolchain, components and Linux targets on first use.
      - uses: Swatinem/rust-cache@v2

      - name: Install Python environment and build the Rust extension
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check python tests
          uv run ruff format --check python tests
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Python tests
        run: uv run pytest

      # The same commands `databricks bundle deploy` runs (see databricks.yml).
      # Nothing is published; this only checks both architectures build.
      - name: Build Databricks wheels
        run: |
          uv run maturin build --release --target x86_64-unknown-linux-gnu --zig --compatibility manylinux_2_17 -i python3.12
          uv run maturin build --release --target aarch64-unknown-linux-gnu --zig --compatibility manylinux_2_17 -i python3.12
